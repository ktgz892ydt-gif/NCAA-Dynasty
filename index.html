<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty HQ</title><link rel="stylesheet" href="assets/styles.css"></head>
<body>
<header class="wrap shell">
  <div class="topbar"><h1>Dynasty HQ</h1><button class="ghost" id="theme" type="button">◐ Theme</button></div>
  <div class="season-nav"><div id="season-tabs" class="season-tabs" role="tablist" aria-label="Season"></div>
    <button class="ghost" id="history-button" type="button" aria-pressed="false">History</button></div>
  <div id="load-status" class="load-status" role="status" aria-live="polite"></div>
</header>
<main id="season-panel" class="wrap" role="tabpanel" aria-label="Selected season"></main>
<section id="history-panel" class="wrap" hidden aria-label="Dynasty history"></section>
<template id="season-template">
<div>

<p class="sub" id="sub"></p><p class="prov" id="prov"></p>
<details class="season-coverage"><summary>Season coverage</summary><p id="coverage-detail" class="note"></p></details>

  <div class="tabs" id="tabs">
    <button class="tab on" data-v="dynasty">Dynasty</button>
    <button class="tab" data-v="h2h">Head-to-Head</button>
    <button class="tab" data-v="sched">Schedules</button>
    <button class="tab" data-v="national">National</button>
    <button class="tab" data-v="leaders">Leaders</button>
  </div>

  <section id="v-dynasty">
    <div class="season-summaries" aria-label="Season summaries"></div>
    <div class="cards" id="cards"></div>
    <div class="card open">
      <p class="h2">Every stat, with national rank</p>
      <p class="note">Rank is out of the <b id="nteams"></b> real FBS teams on the national
        Team Stats screens; the FCS buckets are excluded. A ● marks the best of the three.</p>
      <div class="stat-controls">
        <label>Find a measure<input type="search" id="statsearch" placeholder="Search stats…"></label>
        <label>Stat group<select id="statgroup"><option value="">All groups</option></select></label>
      </div>
      <p class="table-hint" id="statcount" role="status" aria-live="polite"></p>
      <p class="table-hint">Tap a measure marked ⓘ to see what it means.</p>
      <div class="flow"><table id="leadtable" role="table" aria-label="Team stat comparison"></table></div>
    </div>
  </section>

  <section id="v-h2h" class="hide">
    <div class="row">
      <label class="lbl" for="h2hpick">Stat</label>
      <select id="h2hpick"></select>
      <button class="ghost" id="h2h-help" type="button">About this measure ⓘ</button>
    </div>
    <div class="two">
      <div class="card">
        <p class="h2" id="h2h-title"></p>
        <p class="note" id="h2h-note"></p>
        <div class="legend" id="h2h-legend"></div>
        <div id="bars"></div>
      </div>
      <div class="card">
        <p class="h2">Team profile</p>
        <p class="note">Eight core measures, each scaled against the other two.
          Lower-is-better axes are inverted, so a bigger shape is a better team.</p>
        <div id="radar"></div>
      </div>
    </div>
  </section>

  <section id="v-sched" class="hide">
    <div class="sched" id="scheds"></div>
  </section>

  <section id="v-national" class="hide">
    <div class="card" style="margin-bottom:14px">
      <p class="h2">National ratings — every team</p>
      <p class="note" id="nat-note"></p>
      <div class="row">
        <input type="search" id="natsearch" aria-label="Filter national teams" placeholder="Filter teams…" style="min-width:200px">
        <span class="lbl" id="natcount"></span>
      </div>
      <p class="table-hint swipe-hint">Swipe the table sideways for more ratings. Tap an arrow to sort.</p>
      <div class="scroll tall" role="region" aria-label="National ratings" tabindex="0"><table id="nattable"></table></div>
    </div>
    <div class="card">
      <p class="h2">National top 10</p>
      <p class="note">Best ten teams in the country on any measure, from the same screens.</p>
      <div class="row"><label class="lbl" for="natpick">Stat</label><select id="natpick"></select></div>
      <div class="scroll" role="region" aria-label="National top ten" tabindex="0"><table id="nattop"></table></div>
    </div>
  </section>

  <section id="v-leaders" class="hide">
    <div class="card">
      <p class="h2">National player leaders</p>
      <p class="note" id="lead-note"></p>
      <div class="row" id="leadrow"><label class="lbl" for="leadpick">Category</label><select id="leadpick"></select></div>
      <p class="table-hint swipe-hint">Swipe the table sideways to see every stat.</p>
      <div class="scroll" role="region" aria-label="Player leaders" tabindex="0"><table id="leadtbl"></table></div>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<div class="tt" id="tt"></div>
<dialog id="measure-dialog" aria-labelledby="measure-title" aria-describedby="measure-summary">
  <div class="dialog-head"><h2 id="measure-title"></h2><button class="dialog-close" id="measure-close" type="button" aria-label="Close explanation" autofocus>×</button></div>
  <p id="measure-summary"></p>
  <p class="dialog-detail" id="measure-detail"></p>
</dialog>

</template>
<noscript><p>This dashboard requires JavaScript to load season data.</p></noscript>
<script type="module" src="assets/app.js"></script>
</body></html>
